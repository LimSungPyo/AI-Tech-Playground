[project]
name = "ai-tech-playground-backend"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.147.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "sqlalchemy==2.1.6",
    "psycopg[binary]==3.3.6",
    "python-multipart==0.0.32",
    "email-validator==2.3.0",
]

[tool.uv]
# 배포할 패키지가 아니라 앱이라서, 의존성만 설치하고 프로젝트 자체는 설치하지 않는다
package = false
# 나온 지 3일 안 된 버전은 받지 않는다. 악성 버전은 보통 며칠 안에 발견돼 내려간다.
# frontend의 minimumReleaseAge, .github/dependabot.yml의 cooldown과 같은 값이다.
exclude-newer = "3 days"

[tool.ruff]
# 한 줄에 검사 항목을 길게 쓰는 코드(scripts/smoke_test.py 등)가 많아 기본값 88 대신 120으로 둔다
line-length = 120

[tool.ruff.format]
# 화면 값을 옮겨 적은 샘플 데이터와 한 줄에 검사 하나씩 쓴 스모크 테스트는 포맷하면 줄이 몇 배로 늘어나 뺀다 (린트는 한다)
exclude = ["app/fixtures/*", "scripts/smoke_test.py"]

[dependency-groups]
dev = [
    "ruff==0.17.6",
]
