# 로컬 개발 환경: docker compose up --build
# 값은 모두 루트 .env에서 읽는다. 없는 값이 있으면 어떤 변수인지 알려 주고 멈춘다.
services:
  db:
    # 해시로 고정한다. CI(ci.yml)의 postgres와 같은 이미지이고 해시는 Dependabot이 올린다.
    image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?.env에 POSTGRES_DB가 없습니다}
      POSTGRES_USER: ${POSTGRES_USER:?.env에 POSTGRES_USER가 없습니다}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env에 POSTGRES_PASSWORD가 없습니다}
    # 127.0.0.1에만 연다. 그냥 포트만 적으면 와이파이 등 모든 네트워크에 열려 같은 망의 누구나 DB에 접속할 수 있다.
    ports:
      - "127.0.0.1:${DB_PORT:?.env에 DB_PORT가 없습니다}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    # 루트 .env를 그대로 넘긴다. 아래 environment는 Docker 안에서 값이 달라야 하는 것만 덮어쓴다.
    env_file: .env
    environment:
      # 컨테이너 안에서는 localhost가 아니라 db 서비스로 접속한다
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    # 127.0.0.1에만 연다. 프론트는 Docker 네트워크(backend:8000)로 붙어서 영향이 없다.
    ports:
      - "127.0.0.1:${BACKEND_PORT:?.env에 BACKEND_PORT가 없습니다}:8000"
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      # Docker 안에서는 백엔드를 서비스 이름으로 찾는다
      VITE_API_PROXY: http://backend:8000
      # Docker 볼륨에서는 파일 변경 이벤트가 안 와서 폴링으로 감시한다
      CHOKIDAR_USEPOLLING: "true"
    # 같은 와이파이의 휴대폰 등에서도 열 수 있게 모든 네트워크에 연다.
    # 같은 망의 다른 사람도 접속할 수 있으니 공용 와이파이에서는 주의한다.
    ports:
      - "${FRONTEND_PORT:?.env에 FRONTEND_PORT가 없습니다}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  db-data:
