# dev, main에 머지(푸시)될 때 빌드한다. 결과는 discord-notify.yml이 받아서 알린다.
# 이름(name)을 바꾸면 discord-notify.yml의 workflow_run.workflows도 같이 바꿔야 한다.
name: CI

on:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # TODO: 프로젝트가 생기면 실제 빌드 명령으로 바꾼다. (예: npm ci && npm run build)
      - name: Build
        run: echo "아직 빌드할 프로젝트가 없어요"
