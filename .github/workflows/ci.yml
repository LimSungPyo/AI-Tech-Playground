# dev, main에 머지(푸시)될 때와 dev, main으로 가는 PR에서 frontend·backend를 검사하고 Docker 이미지가 빌드되는지 확인한다.
# 푸시 결과는 discord-notify.yml이 받아서 알리고, PR 결과는 PR 화면의 체크로만 본다.
# 이름(name)을 바꾸면 discord-notify.yml의 workflow_run.workflows도 같이 바꿔야 한다.
# 다른 브랜치는 Actions 탭 → CI → Run workflow에서 브랜치를 골라 수동으로 돌린다.
name: CI

on:
  push:
    branches: [dev, main]
  # Dependabot PR처럼 머지 전에 검사가 필요한 PR. pull_request는 시크릿을 받지 못하고 토큰도 읽기 전용이라
  # 포크 PR이 돌려도 안전하다. 이 워크플로는 시크릿을 쓰지 않는다 (JWT_SECRET은 CI 전용 값).
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

# 같은 PR에 다시 푸시하면 앞서 돌던 검사를 취소한다. dev·main 푸시는 취소하지 않는다
# (취소되면 discord-notify.yml이 '빌드 취소'로 알리고, 커밋마다 결과가 남아야 하기 때문이다).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 액션은 태그가 아니라 커밋 해시로 고정한다. 태그는 액션 저장소가 털리면 다른 코드로 옮겨질 수 있다.
# 해시 옆 주석의 버전은 Dependabot이 해시와 같이 올려 준다 (.github/dependabot.yml).

jobs:
  frontend:
    runs-on: ubuntu-latest
    # 지정하지 않으면 설치 등이 멈췄을 때 최대 6시간 동안 돈다
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 이후 단계(패키지 설치 스크립트 등)가 .git/config에 남은 토큰을 읽지 못하게 한다
          persist-credentials: false

      # Node 버전은 .nvmrc, pnpm 버전은 package.json의 packageManager를 따른다
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json
          cache: true
          cache_dependency_path: frontend/pnpm-lock.yaml

      # lock 파일과 package.json이 어긋나면 여기서 실패한다
      - name: Install
        run: pnpm install --frozen-lockfile

      # 알려진 취약점이 high 이상이면 실패한다
      - name: Audit
        run: pnpm audit --audit-level high

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      db:
        # docker-compose.yml과 같은 이미지. 해시는 Dependabot이 올린다.
        image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
        env:
          POSTGRES_DB: ai_playground
          POSTGRES_USER: playground
          POSTGRES_PASSWORD: playground
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U playground -d ai_playground"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    # CI에는 .env가 없어서 backend가 필수로 읽는 값만 여기서 넘긴다
    env:
      DATABASE_URL: postgresql+psycopg://playground:playground@localhost:5432/ai_playground
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 이후 단계(패키지 설치 스크립트 등)가 .git/config에 남은 토큰을 읽지 못하게 한다
          persist-credentials: false

      # Python 버전은 .python-version을 따른다.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # 지정하지 않으면 그때그때 최신 uv를 받는다. backend/Dockerfile의 uv 이미지 버전과 맞춘다.
          version: "0.13.8"
          working-directory: backend
          enable-cache: true
          # working-directory(backend) 기준 경로다
          cache-dependency-glob: uv.lock

      # uv.lock과 pyproject.toml이 어긋나면 여기서 실패한다
      - name: Install
        run: uv sync --locked

      # 알려진 취약점이 있으면 실패한다. uv audit은 아직 미리보기 기능이라 경고를 끄는 옵션을 붙인다.
      - name: Audit
        run: uv audit --locked --preview-features audit-command

      # 설정은 pyproject.toml의 [tool.ruff]. 로컬에서 고치기: uv run ruff check --fix, uv run ruff format
      - name: Lint
        run: uv run ruff check --output-format github

      - name: Format
        run: uv run ruff format --check

      - name: Start API
        run: |
          uv run uvicorn app.main:app --port 8000 > uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          echo "API가 30초 안에 뜨지 않았습니다"
          exit 1

      # 시작할 때 create_all이 실패해도 API는 뜨므로, 테이블이 실제로 생겼는지 따로 확인한다
      - name: Check DB tables
        run: |
          uv run python -c "
          from sqlalchemy import inspect
          from app.db import engine
          tables = inspect(engine).get_table_names()
          assert tables, 'DB에 테이블이 없습니다. uvicorn.log를 확인하세요.'
          print(f'테이블 {len(tables)}개:', ', '.join(sorted(tables)))
          "

      - name: Smoke test
        run: uv run python scripts/smoke_test.py http://127.0.0.1:8000

      - name: Show API log
        if: always()
        run: cat uvicorn.log

  # docker compose가 쓰는 이미지가 빌드되는지만 확인한다 (푸시하지 않음).
  # Dockerfile이나 lock 파일이 어긋나 이미지가 깨져도 CI가 통과하던 문제를 막는다.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build backend image
        run: docker build ./backend

      - name: Build frontend image
        run: docker build ./frontend
