# 의존성 버전 업데이트 PR을 dev로 매월 1일 09:00(한국 시간)에 올린다.
# - 매주 받기엔 PR이 많아 월 1회로 했다. 보안 업데이트 PR(저장소 설정)은 이 일정과 상관없이 취약점이 알려지면 바로 온다.
# - cooldown: 새 버전이 나오고 3일 지나야 PR을 올린다. 악성 버전은 보통 며칠 안에 내려가기 때문이다.
#   pnpm의 minimumReleaseAge, uv의 exclude-newer(둘 다 3일)와 맞춘 값이라 같이 바꾼다.
#   보안 업데이트 PR(저장소 설정)은 cooldown을 기다리지 않는다.
# - 생태계마다 마이너·패치 업데이트는 PR 하나로 묶어 PR이 쌓이지 않게 한다.
#   메이저 업데이트는 묶지 않고 패키지마다 따로 올린다. 고칠 코드가 생길 수 있어 하나씩 보고 받거나 닫는다.
#   따로 올라온 PR을 닫으면 Dependabot은 그 버전을 다시 올리지 않는다.
# - 런타임 버전(Python·Node·PostgreSQL)은 저장소에 정해 둔 버전을 따르므로 버전을 올리는 PR은 막는다.
#   같은 버전 안의 이미지 해시 갱신은 그대로 받는다. 올릴 때는 직접 정해서 관련 파일을 같이 바꾼다.
#     Python 3.12 : backend/.python-version, pyproject.toml(requires-python), backend/Dockerfile
#     Node 24     : frontend/.nvmrc, package.json(engines), frontend/Dockerfile, @types/node
#     PostgreSQL 16: docker-compose.yml, ci.yml. 메이저가 바뀌면 기존 DB 볼륨을 읽지 못해 덤프·복원이 필요하다
version: 2
updates:
  # 워크플로의 액션 커밋 해시와 옆 버전 주석
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Seoul
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: dev
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Seoul
    cooldown:
      default-days: 3
    groups:
      frontend:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Node 24에 맞춘 타입이라 Node와 같이 올린다
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # 8은 바뀐 점이 많아 기획이 정해진 뒤 직접 올린다 (#9). 7.x 업데이트는 그대로 받는다
      - dependency-name: react-router
        versions: [">= 8"]

  - package-ecosystem: uv
    directory: /backend
    target-branch: dev
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Seoul
    cooldown:
      default-days: 3
    groups:
      backend:
        patterns: ["*"]
        update-types: [minor, patch]

  # Dockerfile의 베이스 이미지 해시
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    target-branch: dev
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Seoul
    cooldown:
      default-days: 3
    groups:
      docker:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # 3.12 → 3.13처럼 Python은 마이너 버전이 곧 언어 버전이라 마이너도 막는다
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  # docker-compose.yml의 postgres 이미지 해시
  - package-ecosystem: docker-compose
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Seoul
    cooldown:
      default-days: 3
    groups:
      compose:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
